apiVersion: apps/v1
kind: Deployment
metadata:
  name: siem-backend
  namespace: siem-dev
spec:
  replicas: 2
  selector:
    matchLabels:
      app: siem-backend
  template:
    metadata:
      labels:
        app: siem-backend
    spec:
      imagePullSecrets:
        - name: aliyun-acr-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
      - name: backend-app-init
        image: seclink-siem-cr-registry.cn-hangzhou.cr.aliyuncs.com/siem/siem-backend:v0.72
        securityContext:
          runAsUser: 0
          runAsNonRoot: false
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        command:
        - sh
        - -c
        - |
          mkdir -p /shared/app
          cp -a /app/. /shared/app/
          mkdir -p /shared/app/workflows/flows/generated
          chown -R 999:999 /shared/app
        volumeMounts:
        - name: backend-app
          mountPath: /shared/app
      containers:
      - name: django
        image: seclink-siem-cr-registry.cn-hangzhou.cr.aliyuncs.com/siem/siem-backend:v0.72
        ports:
        - containerPort: 8000
        securityContext:
          allowPrivilegeEscalation: false
          privileged: false
          capabilities:
            drop: ["ALL"]
          readOnlyRootFilesystem: false
        envFrom:
        - configMapRef:
            name: siem-config
        - secretRef:
            name: siem-backend-secret
        env:
        - name: POSTGRES_DB
          value: "siem_db"
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        - name: POSTGRES_HOST
          value: "siem-db"
        volumeMounts:
        - name: backend-app
          mountPath: /app
        resources:
          limits:
            cpu: "1000m"
            memory: "2Gi"
          requests:
            cpu: "500m"
            memory: "1024Mi"
      volumes:
      - name: backend-app
        persistentVolumeClaim:
          claimName: siem-backend-app-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: siem-backend-app-pvc
  namespace: siem-dev
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: "alicloud-nas"
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: siem-backend
  namespace: siem-dev
spec:
  selector:
    app: siem-backend
  ports:
  - port: 80
    targetPort: 8000
